<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Community</title>

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  width:90%;
  max-width:400px;
  text-align:center;
}

input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:8px;
  margin-top:20px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  font-size:16px;
  background:#25D366;
  color:white;
}

.circle{
  width:140px;
  height:140px;
  border-radius:50%;
  border:10px solid #25D366;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  margin:20px auto;
}
</style>
</head>

<body>

<div class="container">
  <h2>Join WhatsApp Community</h2>

  <div class="circle" id="count">0</div>

  <input id="number" placeholder="Enter WhatsApp number with country code">

  <button onclick="submitNumber()">Submit</button>
</div>

<script>
async function loadCount(){
  const res = await fetch("/count");
  const data = await res.json();
  document.getElementById("count").innerText = data.total;
}

loadCount();

async function submitNumber(){
  const number = document.getElementById("number").value;

  const res = await fetch("/save",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ number })
  });

  const data = await res.json();

  if(data.status === "success"){
    alert("Success! Redirecting to WhatsApp group...");
    window.location.href = data.whatsapp;
  }
  else if(data.status === "duplicate"){
    alert("Number already submitted");
  }
  else{
    alert("Error occurred");
  }

  loadCount();
}
</script>

</body>
</html>
